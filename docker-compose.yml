services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000

      # MongoDB
      MONGO_URI: mongodb+srv://Admin:<admin1234>@cluster0.g7npwha.mongodb.net/
      # JWT
      JWT_SECRET: my_super_secret_jwt_key_2026

      # PostgreSQL
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: mydb
      PG_USER: postgres
      PG_PASSWORD: krishna

    depends_on:
      - mongo
      - postgres

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped


  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped


  postgres:
    image: postgres:18
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: krishna
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped


volumes:
  mongo_data:
  postgres_data:
